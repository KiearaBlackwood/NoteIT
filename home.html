<!DOCTYPE html>
<html>
    <head>
        <link rel="stylesheet" href="/static/styles.css" />
        <title>Home</title>
    </head>
    <body>

        <div class="nav" style="text-align: center; padding: 20px; background-color: white; margin-bottom: 10px;">
             <a href="/feed.html">Feed</a> |
             <a href="/account.html">Account</a> |
             <a href="/logout.html">Logout</a>
        </div>

        <div class="post_container">
            <div style="text-align: center;">
                <h1>Hello {{ username }}!</h1>

                <img src="https://s3.amazonaws.com/kblackwood-web-public/{{ profilepic }}" class="profile-pic" style="width:250px;">

                <br/><br/>
                <label for="file">Update Profile Picture:</label>
                <input type="file" id="file">
                <button onclick="upload_file();">Upload</button>
            </div>

            <hr>

            <div class="course_container">
                <h2>Add New Post</h2>
                <div>
                    <strong>{{ username }}</strong><br/>
                    <label for="txtText">Text:</label>
                    <textarea id="txtText" style="width: 100%; height: 80px; margin-top: 10px;"></textarea><br/>
                    <button onclick="addPost();" style="margin-top: 10px;">Add Post</button>
                </div>
            </div>

            <br>

            <h2> My Feed : </h2>
            <div id="divPost"></div>
        </div>

        <script src="/static/script.js"></script>

        <script>
            load_editor_Post('{{ username }}');
        </script>
    </body>
</html>
